<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dr. Dimitris Panagiotakopoulos | Digital Card</title>
    <style>
        /* Modern CSS Reset & Variables */
        :root {
            --bg-color: #080a10; /* Πιο βαθύ μαύρο */
            --primary-cyan: #00f0ff;
            --secondary-cyan: #00a3af;
            --text-main: #f0f4f8;
            --text-muted: #a0aec0;
            --glass-bg: rgba(20, 24, 29, 0.6); /* Θολό background */
            --glass-border: rgba(255, 255, 255, 0.06);
            --ease: cubic-bezier(0.23, 1, 0.32, 1); /* Ομαλή κίνηση */
        }

        * { box-sizing: border-box; margin: 0; padding: 0; outline: none; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow: hidden; /* Για το background animation */
        }

        /* Animated Background Gradient */
        body::before {
            content: '';
            position: absolute;
            width: 150%;
            height: 150%;
            background: radial-gradient(circle at center, rgba(0, 240, 255, 0.08) 0%, rgba(8, 10, 16, 0) 70%);
            animation: pulseBg 10s infinite alternate var(--ease);
            z-index: -1;
        }

        @keyframes pulseBg {
            0% { transform: translate(-25%, -25%) scale(1); }
            100% { transform: translate(-20%, -20%) scale(1.1); }
        }

        /* Glassmorphism Card Container */
        .card-container {
            width: 100%;
            max-width: 380px;
            background: var(--glass-bg);
            backdrop-filter: blur(20px); /* Το εφέ "θολό γυαλί" */
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px; /* Πιο στρογγυλεμένες γωνίες */
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            position: relative;
            overflow: hidden;
            transition: transform 0.3s var(--ease), box-shadow 0.3s var(--ease);
        }

        /* Hover εφέ για την κάρτα (μόνο σε desktop) */
        @media (hover: hover) {
            .card-container:hover {
                transform: translateY(-5px);
                box-shadow: 0 30px 60px rgba(0,0,0,0.6);
                border-color: rgba(0, 240, 255, 0.2);
            }
        }

        /* Tech-style header tag */
        .card-container::before {
            content: "SYSTEM // IDENTITY";
            position: absolute;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.65rem;
            color: var(--primary-cyan);
            letter-spacing: 2px;
            font-family: 'Courier New', monospace;
            opacity: 0.7;
        }

        /* Εικόνα προφίλ με neon ring */
        .profile-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: padding-box, linear-gradient(135deg, var(--primary-cyan), #0047ab) border-box;
            border: 4px solid transparent; /* Neon ring effect */
            margin: 20px auto 20px;
            object-fit: cover;
            display: block;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.2);
        }

        h1 {
            font-size: 1.6rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
            background: linear-gradient(180deg, #fff 0%, #c0c0c0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .badges {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 30px;
            font-family: 'Courier New', monospace;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .badges span { color: var(--primary-cyan); font-weight: bold; }

        .btn-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        /* Modernized Buttons */
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 16px 20px;
            background: rgba(255, 255, 255, 0.03);
            color: var(--text-main);
            text-decoration: none;
            border: 1px solid var(--glass-border);
            border-radius: 14px;
            font-size: 0.95rem;
            font-weight: 600;
            transition: all 0.25s var(--ease);
            position: relative;
            overflow: hidden;
        }

        /* Λάμψη κατά το hover */
        .btn::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.05) 50%, rgba(255,255,255,0) 100%);
            top: 0; left: -100%;
            transition: left 0.5s var(--ease);
        }

        .btn:hover {
            border-color: rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.06);
            transform: scale(1.02);
        }

        .btn:hover::after {
            left: 100%;
        }

        /* Primary Button (Neon Style) */
        .btn-primary {
            background: linear-gradient(135deg, var(--primary-cyan) 0%, var(--secondary-cyan) 100%);
            color: #001015;
            font-weight: 700;
            border: none;
            box-shadow: 0 4px 15px rgba(0, 240, 255, 0.3);
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, #5cf6ff 0%, var(--primary-cyan) 100%);
            box-shadow: 0 6px 20px rgba(0, 240, 255, 0.5);
            color: #001015;
        }

        /* Icons */
        .icon {
            width: 20px;
            height: 20px;
            fill: currentColor;
            opacity: 0.8;
        }

        footer {
            margin-top: 35px;
            font-size: 0.7rem;
            color: var(--text-muted);
            font-family: 'Courier New', monospace;
            opacity: 0.6;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

            </a>

        <footer>

    </div>

</body>
</html>
